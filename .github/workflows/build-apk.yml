name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Release APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          cp app/build/outputs/apk/debug/app-debug.apk "CosmoScan-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoScan-APK
          path: CosmoScan-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "CosmoScan ${{ github.ref_name }}"
          body: |
            ### CosmoScan ${{ github.ref_name }} — Анализ состава косметики по камере
            - Офлайн-распознавание состава (INCI / RU) через камеру (CameraX + Google ML Kit OCR)
            - Оценка концентрации активов по правилу 1% и выявление агрессивных компонентов
            - Локальная база ингредиентов (Room) + автоматический поиск по API (Open Beauty Facts / Wikipedia / Europe PMC)
            - Прикрепление научных статей, заключений дерматологов и организаций здравоохранения (CIR, SCCS, PubMed)
          files: CosmoScan-*.apk
